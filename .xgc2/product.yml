schema: xgc2.product.v1
id: xsim
name: xsim
version: 1.0.1
kind: ros1-apt
summary: Standalone ECS world with original FS150/Scout/Mecanum ROS interfaces and integrated CPU/GPU sensing.
ros:
  distro: noetic
  packages: []
apt:
  distribution: focal
  install: [xsim]
  packages: [xsim]
  depends: [ros-noetic-roscpp, ros-noetic-mavros-msgs, ros-noetic-rosgraph-msgs, libglfw3]
usage:
  install: sudo apt install xsim
  smoke_test: /opt/xgc2/xsim/bin/xsim --help
  notes: Source Noetic before direct CLI use. One desired world JSON supplies the actual Session epoch; one Unix control socket serves management. GPU has no CPU fallback. The sensor implementation is built from the explicit convex_geometry checkout, never copied into this owner.
ownership:
  paths:
  - /opt/xgc2/xsim
release:
  repository: XGC-Team/xgc2-xsim
  ref: main
  workflow: release.yml
  ci_workflow: ci.yml
  requires: [libxgc2-math-dev, libxgc2-robotics-interfaces-dev]
  dependency_policy:
    libxgc2-math-dev: verify
    libxgc2-robotics-interfaces-dev: rebuild
  apt_versions:
    focal: 1.0.1
